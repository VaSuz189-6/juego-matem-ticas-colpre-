<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Misión Entera | Inicio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="../css/mision-entera.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="app landing-app">
    <header class="topbar">
      <a class="brand brand-link" href="menu.html" aria-label="Volver al inicio">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C9 5 7.5 9 7.5 13.5c0 1.6.3 3 .8 4.2L12 22l3.7-4.3c.5-1.2.8-2.6.8-4.2C16.5 9 15 5 12 2Z" fill="#49d8ff" opacity="0.9"/><circle cx="12" cy="10.5" r="2.1" fill="#060a1f"/><path d="M8.3 15.5 5 17.8l1.4-4.2M15.7 15.5 19 17.8l-1.4-4.2" stroke="#ffb84d" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        <span class="brand-name">Desafío Matemático</span>
      </a>
    </header>

    <main class="landing-screen page-shell">
      <div id="updateBar" class="update-bar" hidden>
        <span id="updateMessage">Buscando actualizaciones...</span>
        <progress id="updateProgress" max="100" value="0" hidden></progress>
        <button id="updateAction" class="update-action" type="button" hidden>Actualizar ahora</button>
      </div>
      <section class="landing-hero page-panel">
        <span class="eyebrow">CENTRO DE CONTROL EDUCATIVO</span>
        <h1>Desafío Matemático</h1>
        <p class="tagline">Pilotea tu nave resolviendo operaciones con números enteros antes de que se agote el tiempo.</p>
        <p class="device-note">Practica, supera los cuatro niveles y termina cada misión con una nota de 0.1 a 5.0.</p>
        <a class="primary-btn landing-cta" href="grados.html">Iniciar misión <span aria-hidden="true">→</span></a>
      </section>
    </main>
  </div>
  <script src="../js/starfield.js"></script>
  <script src="../js/update-ui.js"></script>
</body>
</html>
